name: Update README Date

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update date in README
        run: |
          YEAR=$(TZ=Asia/Shanghai date '+%Y')
          MONTH=$(TZ=Asia/Shanghai date '+%-m')
          DAY=$(TZ=Asia/Shanghai date '+%d')
          TODAY="${YEAR} 年 ${MONTH} 月 ${DAY} 日"

          echo "New date: ${TODAY}"

          sed -i -E "s/> 更新时间：.*/> 更新时间：${TODAY}/" README.md

          if git diff --quiet README.md; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README date to ${TODAY}"
          git push
